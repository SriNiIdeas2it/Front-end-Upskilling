<!DOCTYPE html>
<html>
<head>
    <title>Navigation Tabs</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            width: 900px;
            margin: 20px auto;
            border: 2px solid #000;
        }

        .menu {
            width: 220px;
            border-right: 2px solid #000;
            background: #f5f5f5;
        }

        .tab {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        .tab:hover {
            background: #ddd;
        }

        .tab.active {
            background: #4CAF50;
            color: white;
            font-weight: bold;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            width: 120px;
        }

        button {
            padding: 8px 20px;
        }
    </style>
</head>

<body>
<div id="currentTime">
    
</div>

<div class="container" >

    <!-- Left Menu -->
    <div class="menu">
        <div class="tab active" onclick="showTab('personnel',this)">
            Personnel Details
        </div>

        <div class="tab" onclick="showTab('company',this)">
            Company Details
        </div>
    </div>

    <!-- Right Content -->
    <div class="content">

        <!-- Personnel -->
        <div id="personnel" class="tab-content active">

            <div class="form-group">
                <label>Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <button onclick="showTab('company', document.querySelectorAll('.tab')[1])">
                Next
            </button>

        </div>

        <!-- Company -->
        <div id="company" class="tab-content">

            <div class="form-group">
                <label>Company</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text">
            </div>

            <button onclick="showTab('personnel', document.querySelectorAll('.tab')[0])">
                Previous
            </button>

            <button>
                Submit
            </button>

        </div>

    </div>

</div>

<script>
function showTab(tabId, element) {

    // Hide all contents
    document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.remove("active");
    });

    // Remove active menu
    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    // Show selected content
    document.getElementById(tabId).classList.add("active");

    // Highlight selected menu
    element.classList.add("active");
}
function showTime() {
	document.getElementById('currentTime').innerHTML = new Date().toUTCString();
}
showTime();
setInterval(function () {
	showTime();
}, 1000);
</script>

</body>
</html>
